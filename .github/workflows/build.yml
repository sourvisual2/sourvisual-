name: Build SourVisual

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.8-bin.zip
          unzip -q gradle-8.8-bin.zip
          export PATH=$PWD/gradle-8.8/bin:$PATH
          gradle wrapper
          chmod +x gradlew
          echo "PATH=$PWD/gradle-8.8/bin:$PATH" >> $GITHUB_ENV

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: sourvisual-1.21
          path: build/libs/*.jar
          if-no-files-found: error
